<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
  .nav-menu-list > li > a {
    text-decoration: none;
    position: relative;
    display: inline-block;
    overflow: hidden;
    z-index: 0;
  }

  .nav-menu-list > li > a::after {
    content: "";
    position: absolute;
    top: -50%;
    right: -50%;
    bottom: -50%;
    left: -50%;
    background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000, #00ff00, #0000ff);
    background-size: 300% 300%;
    z-index: -1;
    border-radius: 100vmax;
    filter: blur(10px);
    opacity: 0;
    transition: opacity 0.5s;
    animation: rotate-97 5s linear infinite;
  }

  .nav-menu-list > li > a:hover::after {
    opacity: 1;
  }

  @keyframes rotate-97 {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @media (max-width: 768px) {
    .nav-desktop {
      display: none !important;
    }

    .hamburger-btn {
      display: flex !important;
    }
  }

  @media (min-width: 769px) {
    .hamburger-btn {
      display: none !important;
    }

    .nav-mobile {
      display: none !important;
    }
  }
</style>

<nav style="background: #0a0814; border-bottom: 1px solid rgba(255,255,255,0.08);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 50;">

  <!-- Nav row -->
  <div style="position: relative; max-width: 1400px; margin: 0 auto;
              padding: 0 2.5rem; height: 72px;
              display: flex; align-items: center; justify-content: space-between;">

    <!-- Logo -->
    <a routerLink="/home" (click)="closeMenu()"
       style="font-family: 'Dancing Script', cursive; font-size: 2rem;
              font-weight: 500; color: #ffffff; text-decoration: none;
              letter-spacing: 1px; opacity: 1; cursor: pointer;">
      Shadrach
    </a>

    <!-- Desktop links -->
    <ul class="nav-menu-list nav-desktop"
        style="display: flex; align-items: center; gap: 3rem; list-style: none; margin: 0; padding: 0;">
      <li>
        <a (click)="scrollToSection('hero-section'); closeMenu()"
           style="font-family: 'Inter', sans-serif; font-size: 0.95rem;
                  font-weight: 300; color: #ffffff;
                  letter-spacing: 0.08em; opacity: 0.85; cursor: pointer;
                  transition: opacity 0.2s ease; padding: 6px 10px; border-radius: 6px;">
          Home
        </a>
      </li>
      <li>
        <a (click)="navigateAndScroll('about-section'); closeMenu()"
           style="font-family: 'Inter', sans-serif; font-size: 0.95rem;
                  font-weight: 300; color: #ffffff;
                  letter-spacing: 0.08em; opacity: 0.85; cursor: pointer;
                  transition: opacity 0.2s ease; padding: 6px 10px; border-radius: 6px;">
          About
        </a>
      </li>
      <li>
        <a (click)="navigateAndScroll('projects-section'); closeMenu()"
           style="font-family: 'Inter', sans-serif; font-size: 0.95rem;
                  font-weight: 300; color: #ffffff;
                  letter-spacing: 0.08em; opacity: 0.85; cursor: pointer;
                  transition: opacity 0.2s ease; padding: 6px 10px; border-radius: 6px;">
          Projects
        </a>
      </li>
      <li>
        <a (click)="navigateAndScroll('contact-section'); closeMenu()"
           style="font-family: 'Inter', sans-serif; font-size: 0.95rem;
                  font-weight: 300; color: #ffffff;
                  letter-spacing: 0.08em; opacity: 0.85; cursor: pointer;
                  transition: opacity 0.2s ease; padding: 6px 10px; border-radius: 6px;">
          Contact
        </a>
      </li>

    </ul>

    <!-- Hamburger (mobile) -->
    <button (click)="toggleMenu()"
            class="hamburger-btn"
            style="flex-direction: column; gap: 5px;
                   background: none; border: none; cursor: pointer; padding: 4px;"
            aria-label="Toggle menu">
      <span style="display: block; width: 24px; height: 1.5px; background: white; border-radius: 4px;"></span>
      <span style="display: block; width: 24px; height: 1.5px; background: white; border-radius: 4px;"></span>
      <span style="display: block; width: 24px; height: 1.5px; background: white; border-radius: 4px;"></span>
    </button>

  </div>

  <!-- Mobile dropdown -->
  <div class="nav-mobile"
       [style.display]="menuOpen ? 'flex' : 'none'"
       style="flex-direction: column; padding: 1rem 2.5rem 1.5rem;
              background: #0a0814; border-top: 1px solid rgba(255,255,255,0.08);">
    <ul class="nav-menu-list" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
      <li>
        <a (click)="scrollToSection('hero-section'); closeMenu()"
           style="color:#fff; padding: 0.6rem 0.5rem; display: block;
                  font-family:'Inter',sans-serif; font-size:0.95rem;
                  font-weight:300; letter-spacing:0.08em; opacity:0.85; cursor:pointer;">
          Home
        </a>
      </li>
      <li>
        <a (click)="navigateAndScroll('about-section'); closeMenu()"
           style="color:#fff; padding: 0.6rem 0.5rem; display: block;
                  font-family:'Inter',sans-serif; font-size:0.95rem;
                  font-weight:300; letter-spacing:0.08em; opacity:0.85; cursor:pointer;">
          About
        </a>
      </li>
      <li>
        <a (click)="navigateAndScroll('projects-section'); closeMenu()"
           style="color:#fff; padding: 0.6rem 0.5rem; display: block;
                  font-family:'Inter',sans-serif; font-size:0.95rem;
                  font-weight:300; letter-spacing:0.08em; opacity:0.85; cursor:pointer;">
          Projects
        </a>
      </li>
      <li>
        <a (click)="navigateAndScroll('contact-section'); closeMenu()"
           style="color:#fff; padding: 0.6rem 0.5rem; display: block;
                  font-family:'Inter',sans-serif; font-size:0.95rem;
                  font-weight:300; letter-spacing:0.08em; opacity:0.85; cursor:pointer;">
          Contact
        </a>
      </li>

    </ul>
  </div>

</nav>

<!-- Spacer to account for fixed navbar -->
<div style="height: 72px;"></div>
