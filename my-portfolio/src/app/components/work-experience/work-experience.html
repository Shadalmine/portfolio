<section style="background: linear-gradient(180deg, rgba(10, 8, 20, 1) 0%, rgba(15, 10, 30, 1) 100%); padding: 6rem 2rem; position: relative; overflow: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #ffffff;">

  <div style="position: absolute; bottom: -50%; left: -20%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%); border-radius: 50%; animation: float 10s ease-in-out infinite; pointer-events: none; z-index: 0;"></div>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .work-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fade-up 0.8s ease both;
    }

    .work-card:hover {
      transform: translateY(-8px);
    }

    .work-card:hover .card-border {
      border-color: rgba(124, 58, 237, 0.6);
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(91, 33, 182, 0.12) 100%);
      box-shadow: 0 20px 60px rgba(124, 58, 237, 0.15);
    }

    .work-card:hover .card-glow {
      opacity: 1;
    }

    .card-link {
      transition: all 0.3s ease;
    }

    .card-link:hover {
      color: #a78bfa;
      gap: 0.75rem;
    }

    .card-link:hover .arrow {
      transform: translateX(4px);
    }

    @media (max-width: 768px) {
      .work-grid {
        grid-template-columns: 1fr !important;
        gap: 1.5rem !important;
      }

      .card-inner {
        padding: 1.5rem !important;
        flex-direction: column !important;
      }

      .card-title {
        font-size: 1rem !important;
      }

      .card-desc {
        font-size: 0.85rem !important;
      }
    }

    @media (max-width: 480px) {
      .work-title {
        font-size: 1.8rem !important;
        margin-bottom: 2rem !important;
      }

      .card-inner {
        padding: 1.25rem !important;
      }

      .card-title {
        font-size: 0.95rem !important;
      }

      .card-desc {
        font-size: 0.8rem !important;
        margin-bottom: 1rem !important;
      }

      .card-link {
        font-size: 0.8rem !important;
      }
    }
  </style>

  <div style="max-width: 1200px; margin: 0 auto; position: relative; z-index: 1;">
    
    <h2 class="work-title" style="font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 800; text-align: center; margin: 0 0 4rem; letter-spacing: -0.02em; color: #ffffff;">
      Experience
    </h2>

    <div class="work-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 2rem; margin: 0;">

      <div *ngFor="let p of projects; let i = index" class="work-card" [style.animation-delay]="(i * 0.1) + 's'" style="position: relative; border-radius: 16px; overflow: hidden; cursor: pointer;">

        <div class="card-border" style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(91, 33, 182, 0.08) 100%); border: 1px solid rgba(124, 58, 237, 0.3); border-radius: 16px; pointer-events: none; z-index: 1; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);"></div>

        <div class="card-glow" style="position: absolute; inset: 0; background: radial-gradient(600px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(124, 58, 237, 0.1), transparent 80%); opacity: 0; border-radius: 16px; transition: opacity 0.3s ease; pointer-events: none; z-index: 1;"></div>

        <div class="card-inner" style="position: relative; z-index: 2; background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(91, 33, 182, 0.08) 100%); border: 1px solid rgba(124, 58, 237, 0.3); border-radius: 16px; padding: 2rem; display: flex; gap: 1.5rem; height: 100%;">
          
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; flex-shrink: 0; padding-top: 0.25rem;">
            <span style="width: 6px; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; display: block;"></span>
            
            <div style="width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; flex-shrink: 0; box-shadow: 0 8px 24px rgba(124, 58, 237, 0.2);" [style.background]="p.iconBg">
              {{ p.icon }}
            </div>
            
            <span style="width: 6px; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; display: block;"></span>
          </div>

          <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
            
            <h3 class="card-title" style="font-size: 1.1rem; font-weight: 700; margin: 0 0 0.75rem; letter-spacing: -0.01em; color: #ffffff; line-height: 1.3;">
              {{ p.title }}
            </h3>

            <p class="card-desc" style="font-size: 0.9rem; font-weight: 300; color: rgba(255, 255, 255, 0.65); line-height: 1.6; margin: 0 0 1.25rem;">
              {{ p.desc }}
            </p>

            <a [href]="p.link" target="_blank" class="card-link" style="display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; color: #60a5fa; text-decoration: none; position: relative; width: fit-content; text-transform: uppercase; letter-spacing: 0.05em;">
              <span>LEARN MORE</span>
              <span class="arrow" style="display: inline-block; transition: transform 0.3s ease;">→</span>
            </a>

          </div>
        </div>

      </div>

    </div>

  </div>

</section>

<div style="height: 24px;"></div>
